name: Remove poster caption

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove poster caption
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          old = '''    st.caption(
        "Poster-aligned dissertation results. The company ranking uses the audited "
        "counted-spill totals already built into this dashboard."
    )
'''

          if old not in text:
              raise SystemExit("Poster caption block not found")

          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          print("Removed poster caption.")

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Remove poster alignment caption"
          git push
