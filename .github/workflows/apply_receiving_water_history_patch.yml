name: Apply receiving-water history explorer

on:
  push:
    branches:
      - main
    paths:
      - tools/patch_receiving_water_history.py
      - .github/workflows/apply_receiving_water_history_patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch dashboard
        run: python tools/patch_receiving_water_history.py

      - name: Validate Python syntax
        run: python -m py_compile app.py receiving_water_history.py

      - name: Commit dashboard changes
        shell: bash
        run: |
          if git diff --quiet -- app.py receiving_water_history.py; then
            echo "No dashboard changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py receiving_water_history.py
          git commit -m "Add receiving-water historical evidence explorer"
          git push
