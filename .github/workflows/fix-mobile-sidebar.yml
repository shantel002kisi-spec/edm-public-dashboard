name: Fix mobile sidebar toggle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-sidebar-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep header space for the mobile sidebar button
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          old = '''      header[data-testid="stHeader"] {
        height: 0 !important;
        min-height: 0 !important;
        background: transparent !important;
        border-bottom: 0 !important;
      }'''

          new = '''      header[data-testid="stHeader"] {
        display: block !important;
        height: 3rem !important;
        min-height: 3rem !important;
        background: transparent !important;
        border-bottom: 0 !important;
        overflow: visible !important;
        z-index: 99999 !important;
      }'''

          if old not in text:
              print("Target header block already changed or not found.")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Updated Streamlit header so the mobile sidebar toggle can render.")

      - name: Commit the fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes needed."
          else
            git commit -m "Fix mobile sidebar toggle visibility"
            git push
          fi
