name: Patch map card totals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch final 2026 totals
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('"label": "2026 forecast outlets shown",\n                        "value": value_text(len(filtered)),\n                        "note": "Mapped receiving-water outlets · not confirmed spills"',
               '"label": "2026 final forecast outlets",\n                        "value": value_text(15596),\n                        "note": "Final rainfall-enhanced forecast population · not confirmed spills"'),
              ('"label": "2026 predicted Low outlets",\n                        "value": value_text(risk_counts["Low"]),\n                        "note": "Forecast receiving-water locations"',
               '"label": "2026 predicted Low outlets",\n                        "value": value_text(8081),\n                        "note": "Final rainfall-enhanced forecast"'),
              ('"label": "2026 predicted Medium outlets",\n                        "value": value_text(risk_counts["Medium"]),\n                        "note": "Forecast receiving-water locations"',
               '"label": "2026 predicted Medium outlets",\n                        "value": value_text(6808),\n                        "note": "Final rainfall-enhanced forecast"'),
              ('"label": "2026 predicted High outlets",\n                        "value": value_text(risk_counts["High"]),\n                        "note": "Forecast receiving-water locations"',
               '"label": "2026 predicted High outlets",\n                        "value": value_text(707),\n                        "note": "Final rainfall-enhanced forecast"'),
          ]
          changed = 0
          for old, new in replacements:
              n = text.count(old)
              print('match', n, old.splitlines()[0])
              if n:
                  text = text.replace(old, new, 1)
                  changed += 1
          if changed != 4:
              raise SystemExit(f'Expected 4 replacements, made {changed}')
          path.write_text(text, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Update interactive prediction cards to final 2026 totals"
          git push
