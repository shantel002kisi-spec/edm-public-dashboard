name: Inspect forecast numbers

on:
  push:
    paths:
      - '.github/workflows/inspect-forecast-numbers.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show prediction code ranges
        shell: python
        run: |
          from pathlib import Path
          lines = Path("app.py").read_text(encoding="utf-8").splitlines()
          for start, end in [(17345,17420),(20380,20540),(20540,20780)]:
              print(f"=== LINES {start}-{end} ===")
              for i in range(start, min(end, len(lines))+1):
                  print(f"{i}: {lines[i-1]}")
