name: Inspect forecast numbers

on:
  push:
    paths:
      - '.github/workflows/inspect-forecast-numbers.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find risk columns matching dissertation totals
        shell: python
        run: |
          import csv, gzip
          from collections import Counter
          from pathlib import Path

          p = Path("data/rainfall_risk_predictions_2026_ytd.csv.gz")
          with gzip.open(p, "rt", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          print("ROWS", len(rows))
          for c in rows[0]:
              counts = Counter((r.get(c) or "").strip().title() for r in rows)
              nonblank = {k:v for k,v in counts.items() if k}
              if nonblank and set(nonblank).issubset({"Low","Medium","High"}) and sum(nonblank.values()) == len(rows):
                  print(c, nonblank)

          print("SELECTED MODEL", Counter(r.get("selected_model","") for r in rows))
