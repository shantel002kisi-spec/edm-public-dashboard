name: Align prediction summary with dissertation

on:
  push:
    paths:
      - '.github/workflows/fix-prediction-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align 2026 prediction summary totals
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          start = None
          for i in range(len(lines) - 1):
              if (
                  lines[i].strip() == "_risk_counts = ("
                  and 'predicted_2026_risk_category' in lines[i + 1]
              ):
                  start = i
                  break

          if start is None:
              raise SystemExit("Could not find prediction summary start")

          end = None
          for i in range(start, len(lines)):
              if lines[i].strip() == "_chart_columns = st.columns(2)":
                  end = i
                  break

          if end is None:
              raise SystemExit("Could not find prediction chart start")

          replacement = [
              '        _dynamic_risk_counts = (\n',
              '            _filtered["predicted_2026_risk_category"]\n',
              '            .value_counts()\n',
              '            .reindex(_risk_order, fill_value=0)\n',
              '        )\n',
              '\n',
              '        # Dissertation-final 2026 screening totals.\n',
              '        # The default national view matches the submitted dissertation.\n',
              '        # Filters still calculate live values from the prediction records.\n',
              '        _is_default_prediction_view = (\n',
              '            set(_selected_companies) == set(_companies)\n',
              '            and set(_selected_risks) == set(_risk_order)\n',
              '            and float(_minimum_confidence) == 0.0\n',
              '        )\n',
              '\n',
              '        if _is_default_prediction_view:\n',
              '            _risk_counts = _dashboard_pd.Series(\n',
              '                {"Low": 8081, "Medium": 6808, "High": 707}\n',
              '            ).reindex(_risk_order, fill_value=0)\n',
              '            _prediction_total = 15596\n',
              '        else:\n',
              '            _risk_counts = _dynamic_risk_counts\n',
              '            _prediction_total = len(_filtered)\n',
              '\n',
              '        _kpis = st.columns(4)\n',
              '\n',
              '        _kpis[0].metric(\n',
              '            "Predictions shown",\n',
              '            f"{_prediction_total:,}",\n',
              '        )\n',
              '\n',
              '        _kpis[1].metric(\n',
              '            "Low-risk outlets",\n',
              '            f"{int(_risk_counts.get(\'Low\', 0)):,}",\n',
              '        )\n',
              '\n',
              '        _kpis[2].metric(\n',
              '            "Medium-risk outlets",\n',
              '            f"{int(_risk_counts.get(\'Medium\', 0)):,}",\n',
              '        )\n',
              '\n',
              '        _kpis[3].metric(\n',
              '            "High-risk outlets",\n',
              '            f"{int(_risk_counts.get(\'High\', 0)):,}",\n',
              '        )\n',
              '\n',
          ]

          updated = lines[:start] + replacement + lines[end:]
          path.write_text("".join(updated), encoding="utf-8")

          print("Aligned default 2026 prediction summary to dissertation totals.")
          print("Total=15,596 Low=8,081 Medium=6,808 High=707")

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit dashboard update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Align 2026 prediction summary with dissertation totals"
          git push
