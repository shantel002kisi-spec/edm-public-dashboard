name: Simplify spill card labels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simplify-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove dataset and duplicate-row wording from spill cards
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          original = text

          replacements = [
              ("All water companies · combined EDM dataset · exact duplicate rows removed", "All water companies"),
              ("All water companies · combined EDM dataset · exact duplicated rows removed", "All water companies"),
              (" · combined EDM dataset", ""),
              (" · exact duplicate rows removed", ""),
              (" · exact duplicated rows removed", ""),
          ]

          for old, new in replacements:
              text = text.replace(old, new)

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Spill-card source labels simplified.")
          else:
              print("No matching spill-card wording found; no change required.")

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py change needed."
          else
            git commit -m "Simplify spill card source labels"
            git push
          fi
