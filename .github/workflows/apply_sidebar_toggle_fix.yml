name: Apply sidebar toggle fix

on:
  push:
    branches:
      - main
    paths:
      - tools/patch_sidebar_toggle.py
      - .github/workflows/apply_sidebar_toggle_fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch dashboard
        run: python tools/patch_sidebar_toggle.py

      - name: Validate Python
        run: python -m py_compile app.py

      - name: Commit dashboard changes
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No dashboard changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Keep sidebar toggle visible on full screen"
          git push
