name: Remove persistent High-risk chart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove confusing persistent High-risk company chart
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          key = 'key="priority_persistent_company_chart"'
          key_pos = text.find(key)
          if key_pos == -1:
              print("Chart already removed; nothing to do.")
              raise SystemExit(0)

          # Find the st.plotly_chart( call containing this unique chart key.
          start = text.rfind("st.plotly_chart(", 0, key_pos)
          if start == -1:
              raise SystemExit("Could not find the plotly chart call for the persistence chart")

          # Preserve indentation by removing from the beginning of that line.
          line_start = text.rfind("\n", 0, start) + 1

          # Walk forward from the opening parenthesis and find the matching close.
          open_paren = text.find("(", start)
          depth = 0
          in_single = False
          in_double = False
          escape = False
          end = None
          for i in range(open_paren, len(text)):
              ch = text[i]
              if escape:
                  escape = False
                  continue
              if ch == "\\":
                  escape = True
                  continue
              if ch == "'" and not in_double:
                  in_single = not in_single
                  continue
              if ch == '"' and not in_single:
                  in_double = not in_double
                  continue
              if in_single or in_double:
                  continue
              if ch == "(":
                  depth += 1
              elif ch == ")":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("Could not find the end of the persistence chart call")

          # Include the line break after the chart call.
          while end < len(text) and text[end] in " \t":
              end += 1
          if end < len(text) and text[end] == "\n":
              end += 1

          updated = text[:line_start] + text[end:]
          if key in updated:
              raise SystemExit("Persistence chart key still present after patch")

          path.write_text(updated, encoding="utf-8")
          print("Removed persistent High-risk company chart")

      - name: Commit dashboard update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Remove confusing persistent High-risk company chart"
          git push
