name: Inspect poster result sections

on:
  push:
    paths:
      - '.github/workflows/inspect-poster-result-sections.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show company results page
        shell: python
        run: |
          from pathlib import Path
          lines = Path("app.py").read_text(encoding="utf-8").splitlines()
          for start,end in [(18680,18940),(17180,17340)]:
              print(f"=== {start}:{end} ===")
              for i in range(start, min(end,len(lines))+1):
                  print(f"{i}: {lines[i-1]}")
