name: Apply poster results

on:
  push:
    paths:
      - '.github/workflows/inspect-poster-result-sections.yml'
      - '.github/scripts/patch_poster_results.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard
        run: python .github/scripts/patch_poster_results.py

      - name: Commit dashboard update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Align dashboard results with dissertation poster"
          git push
