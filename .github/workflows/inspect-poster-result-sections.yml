name: Apply poster results

on:
  push:
    paths:
      - '.github/workflows/inspect-poster-result-sections.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add poster-aligned results
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          if "Key results from the dissertation poster" in text:
              print("Poster results already added.")
              raise SystemExit(0)

          marker = '# =============================================================================\n# PAGE 2 — COMBINED OBSERVED/PREDICTED MAP EXPERIENCE\n# =============================================================================\n'

          if marker not in text:
              raise SystemExit("Could not find PAGE 2 marker")

          insert = """    section_header(
        "Key results from the dissertation poster",
        "These are the same 2021–2025 results shown on the completed dissertation poster.",
    )

    poster_top_five = audited_company_spill_summary().head(5).copy()
    poster_top_five = poster_top_five[
        [
            "spill_rank_2021_2025",
            "water_company_name",
            "total_counted_spills_2021_2025",
        ]
    ].rename(
        columns={
            "spill_rank_2021_2025": "Rank",
            "water_company_name": "Water company",
            "total_counted_spills_2021_2025": "2021–2025 counted spills",
        }
    )
    poster_top_five["Rank"] = poster_top_five["Rank"].astype(int)
    poster_top_five["2021–2025 counted spills"] = (
        poster_top_five["2021–2025 counted spills"]
        .round(0)
        .astype(int)
        .map(lambda value: f"{value:,}")
    )

    st.markdown("#### Companies with the highest five-year spill totals")
    st.dataframe(
        poster_top_five,
        use_container_width=True,
        hide_index=True,
    )

    poster_high, poster_low = st.columns(2)

    with poster_high:
        st.error(
            "⚠️ Highest observed spill site in 2025\n\n"
            "**Nearby town:** South Molton  \n"
            "**Treatment site:** South Molton WWTW  \n"
            "**Water company:** South West Water  \n"
            "**Receiving water:** River Mole  \n"
            "**2025 highest spill:** 261"
        )

    with poster_low:
        st.success(
            "✅ Lowest observed spill site in 2025\n\n"
            "**Nearby town:** Chester  \n"
            "**Overflow site:** BATCHE TANKS CSO  \n"
            "**Water company:** Dwr Cymru Welsh Water  \n"
            "**Receiving water:** Bache Brook  \n"
            "**2025 lowest spill:** 0"
        )

    st.caption(
        "Poster-aligned dissertation results. The company ranking uses the audited "
        "counted-spill totals already built into this dashboard."
    )


"""

          text = text.replace(marker, insert + marker, 1)
          path.write_text(text, encoding="utf-8")
          print("Poster-aligned results added to Start here.")

      - name: Commit app update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Align dashboard results with dissertation poster"
          git push
