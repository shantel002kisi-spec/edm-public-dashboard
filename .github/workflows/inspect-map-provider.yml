name: Remove CARTO API watermark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace CARTO basemaps with OpenStreetMap
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          carto_marker = 'tiles="https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png"'
          fixed_marker = 'name="Clean street map"'

          if carto_marker in text:
              start = text.rfind("    folium.TileLayer(", 0, text.index(carto_marker))
              if start < 0:
                  raise SystemExit("Could not locate the start of the CARTO tile layer.")

              end_marker = "    ).add_to(water_map)"
              end = start
              for _ in range(3):
                  end = text.index(end_marker, end) + len(end_marker)
                  while end < len(text) and text[end] in "\r\n":
                      end += 1

              new_lines = [
                  "    folium.TileLayer(",
                  '        tiles="OpenStreetMap",',
                  '        name="Clean street map",',
                  "        show=True,",
                  "        control=True,",
                  "    ).add_to(water_map)",
                  "",
              ]
              replacement = "\n".join(new_lines)
              text = text[:start] + replacement + text[end:]
              path.write_text(text, encoding="utf-8")
              print("Removed CARTO basemaps and made OpenStreetMap the default.")
          elif fixed_marker in text:
              print("Map basemap is already fixed; no change needed.")
          else:
              raise SystemExit("CARTO basemap was not found; app.py was left unchanged.")

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py change needed."
          else
            git commit -m "Remove CARTO API watermark from map"
            git push
          fi
