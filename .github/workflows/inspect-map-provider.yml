name: Inspect map provider

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect map setup
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          for i in range(16888, 16929):
              print(f"{i}: {lines[i-1]}")
