name: Remove CARTO API watermark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace CARTO basemaps with OpenStreetMap
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          old = '''    folium.TileLayer(
              tiles="https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
              attr="&copy; OpenStreetMap contributors &copy; CARTO",
              name="Pastel rivers and places",
              show=True,
              control=True,
              subdomains="abcd",
              max_zoom=20,
          ).add_to(water_map)
          folium.TileLayer(
              tiles="CartoDB positron",
              name="Soft contrast map",
              show=False,
              control=True,
          ).add_to(water_map)
          folium.TileLayer(
              tiles="OpenStreetMap",
              name="Detailed street map",
              show=False,
              control=True,
          ).add_to(water_map)
          '''

          new = '''    folium.TileLayer(
              tiles="OpenStreetMap",
              name="Clean street map",
              show=True,
              control=True,
          ).add_to(water_map)
          '''

          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Removed CARTO basemaps and made OpenStreetMap the default.")
          elif new in text:
              print("Map basemap is already fixed; no change needed.")
          else:
              raise SystemExit("Expected basemap block was not found; app.py was left unchanged.")

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py change needed."
          else
            git commit -m "Remove CARTO API watermark from map"
            git push
          fi
