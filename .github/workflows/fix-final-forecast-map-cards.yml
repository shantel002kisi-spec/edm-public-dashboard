name: Fix final forecast map cards

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use final rainfall-enhanced totals on prediction cards
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          original = text

          anchor = '''        risk_counts = filtered[risk_column].value_counts().reindex(RISK_ORDER, fill_value=0)
          if prediction:
              metric_cards(
'''
          replacement = '''        risk_counts = filtered[risk_column].value_counts().reindex(RISK_ORDER, fill_value=0)
          if prediction:
              # The interactive map still uses the mapped forecast layer, but the summary
              # cards must report the final rainfall-enhanced 2026 forecast population.
              final_forecast = load_table("rainfall_risk_predictions_2026_ytd")
              final_risk_column = "predicted_2026_risk_category"
              if not final_forecast.empty and final_risk_column in final_forecast.columns:
                  final_risk = (
                      final_forecast[final_risk_column]
                      .astype("string")
                      .str.strip()
                      .str.title()
                  )
                  final_risk_counts = (
                      final_risk.value_counts()
                      .reindex(RISK_ORDER, fill_value=0)
                  )
                  final_forecast_total = int(final_risk.isin(RISK_ORDER).sum())
              else:
                  final_risk_counts = risk_counts
                  final_forecast_total = int(len(filtered))

              metric_cards(
'''

          count = text.count(anchor)
          print("anchor count:", count)
          if count != 1:
              raise SystemExit(f"Expected exactly one prediction-card anchor, found {count}")
          text = text.replace(anchor, replacement, 1)

          old_total = '''                    {
                          "label": "2026 forecast outlets shown",
                          "value": value_text(len(filtered)),
                          "note": "Mapped receiving-water outlets · not confirmed spills",
                          "accent": "#B7DDE5",
                      },
'''
          new_total = '''                    {
                          "label": "2026 final forecast outlets",
                          "value": value_text(final_forecast_total),
                          "note": "Final rainfall-enhanced forecast population · not confirmed spills",
                          "accent": "#B7DDE5",
                      },
'''
          if old_total not in text:
              raise SystemExit("Could not find total forecast card block")
          text = text.replace(old_total, new_total, 1)

          for risk, note in [
              ("Low", "Final rainfall-enhanced forecast"),
              ("Medium", "Final rainfall-enhanced forecast"),
              ("High", "Final rainfall-enhanced forecast"),
          ]:
              old = f'''                    {{
                          "label": "2026 predicted {risk} outlets",
                          "value": value_text(risk_counts["{risk}"]),
                          "note": "Forecast receiving-water locations",
                          "accent": '''
              new = f'''                    {{
                          "label": "2026 predicted {risk} outlets",
                          "value": value_text(final_risk_counts["{risk}"]),
                          "note": "{note}",
                          "accent": '''
              if old not in text:
                  raise SystemExit(f"Could not find {risk} forecast card block")
              text = text.replace(old, new, 1)

          if text == original:
              print("No changes required")
          else:
              path.write_text(text, encoding="utf-8")
              print("Updated prediction summary cards to final forecast totals")

      - name: Commit dashboard fix
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Use final 2026 rainfall forecast totals on map cards"
          git push
